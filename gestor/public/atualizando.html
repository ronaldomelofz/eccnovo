<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atualizando — ECC Gestor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: #f1f5f9;
      padding: 1.5rem;
    }
    .box {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: rgba(51, 65, 85, 0.7);
      border: 2px solid #fbbf24;
      border-radius: 1rem;
      padding: 2rem 1.5rem;
    }
    h1 { color: #f472b6; margin: 0 0 1rem; font-size: 1.6rem; }
    p { line-height: 1.5; color: #e2e8f0; }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #475569;
      border-top-color: #fbbf24;
      border-radius: 50%;
      margin: 1.25rem auto;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .file { font-size: 0.8rem; color: #94a3b8; word-break: break-all; margin-top: 1rem; }
    .err { color: #f87171; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="box">
    <h1>ECC Gestor</h1>
    <p><strong>O sistema está em processo de atualização.</strong></p>
    <div class="spinner"></div>
    <p>O instalador será aberto em instantes.<br />Conclua as etapas e, ao finalizar, abra novamente o ECC Gestor.</p>
    <p class="file" id="fileName"></p>
    <p class="err" id="err"></p>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    const file = params.get('file')
    document.getElementById('fileName').textContent = file || ''

    async function run() {
      if (!file) {
        document.getElementById('err').textContent = 'Arquivo de atualização não informado.'
        return
      }
      try {
        await new Promise((r) => setTimeout(r, 1200))
        const res = await fetch('/api/atualizacoes/aplicar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ caminho: file }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.erro || 'Falha ao iniciar atualização')
        document.querySelector('.box p:nth-of-type(2)').innerHTML =
          'Instalador aberto.<br /><strong>O ECC Gestor será fechado</strong> para concluir a atualização.<br />Ao terminar, abra novamente o aplicativo.'
      } catch (e) {
        document.getElementById('err').textContent = e.message
      }
    }
    run()
  </script>
</body>
</html>
